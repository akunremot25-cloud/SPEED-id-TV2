<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer ambient glow border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Antennas -->
  <path d="M190 120 L256 195 L322 120" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="190" cy="120" r="14" fill="#60a5fa" filter="url(#glow)" />
  <circle cx="322" cy="120" r="14" fill="#60a5fa" filter="url(#glow)" />

  <!-- TV Body frame -->
  <rect x="56" y="180" width="400" height="260" rx="36" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- TV Inner Display -->
  <rect x="76" y="200" width="360" height="220" rx="24" fill="url(#screenGrad)" />

  <!-- TV Screen Grid Glow -->
  <path d="M170 200 L170 420 M270 200 L270 420" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />
  <path d="M76 310 L436 310" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />

  <!-- Live Pulse Waves on Screen -->
  <path d="M110 320 Q140 260 170 320 T230 320 T290 270 T350 320 T400 300" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- TV Stand -->
  <path d="M210 440 L200 470 L312 470 L302 440" fill="#1e293b" />
  <rect x="176" y="468" width="160" height="12" rx="6" fill="#3b82f6" />

  <!-- Live Indicator Dot -->
  <circle cx="400" cy="230" r="10" fill="#ef4444" />
  <circle cx="400" cy="230" r="18" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.6">
    <animate attributeName="r" values="12;24;12" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Speed Play Arrow in center -->
  <polygon points="230,240 230,290 275,265" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
</svg>
